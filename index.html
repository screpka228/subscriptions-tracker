<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Трекер подписок</title>
<meta name="description" content="Учёт подписок: суммы, даты списаний и итоги в месяц и в год.">
<meta name="theme-color" content="#2563eb" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f1420" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Подписки">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
  /* ---------- Цвета: светлая тема по умолчанию, тёмная — ниже ---------- */
  :root {
    --bg: #f3f5fa;
    --surface: #ffffff;
    --surface-2: #f7f8fc;
    --text: #161b28;
    --muted: #6b7388;
    --border: #e4e8f1;
    --accent: #2563eb;
    --accent-text: #ffffff;
    --accent-soft: #e8efff;
    --danger: #dc2626;
    --danger-soft: #fdecec;
    --warn: #b45309;
    --warn-soft: #fff4e0;
    --hero-from: #2563eb;
    --hero-to: #7c3aed;
    --shadow: 0 1px 2px rgba(16, 24, 40, 0.06), 0 4px 16px rgba(16, 24, 40, 0.05);
    color-scheme: light;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0c1019;
      --surface: #161c2a;
      --surface-2: #1d2436;
      --text: #e8ecf5;
      --muted: #8f99b0;
      --border: #272f44;
      --accent: #5b8cff;
      --accent-text: #0c1019;
      --accent-soft: #1d2b52;
      --danger: #f47272;
      --danger-soft: #3a1f25;
      --warn: #f5b25c;
      --warn-soft: #3a2e1a;
      --hero-from: #1e3a8a;
      --hero-to: #5b21b6;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.4), 0 4px 16px rgba(0, 0, 0, 0.3);
      color-scheme: dark;
    }
  }

  :root[data-theme="dark"] {
    --bg: #0c1019;
    --surface: #161c2a;
    --surface-2: #1d2436;
    --text: #e8ecf5;
    --muted: #8f99b0;
    --border: #272f44;
    --accent: #5b8cff;
    --accent-text: #0c1019;
    --accent-soft: #1d2b52;
    --danger: #f47272;
    --danger-soft: #3a1f25;
    --warn: #f5b25c;
    --warn-soft: #3a2e1a;
    --hero-from: #1e3a8a;
    --hero-to: #5b21b6;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.4), 0 4px 16px rgba(0, 0, 0, 0.3);
    color-scheme: dark;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.4;
    -webkit-font-smoothing: antialiased;
  }

  /* ---------- Шапка ---------- */
  header {
    position: sticky;
    top: 0;
    z-index: 5;
    background: color-mix(in srgb, var(--bg) 88%, transparent);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--border);
    padding: 12px 16px;
    padding-top: calc(12px + env(safe-area-inset-top));
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .brand { font-size: 18px; font-weight: 700; margin-right: auto; }

  .header-tabs { display: none; gap: 6px; }

  /* ---------- Кнопки ---------- */
  button {
    font: inherit;
    font-size: 15px;
    font-weight: 600;
    border: none;
    border-radius: 12px;
    padding: 11px 18px;
    cursor: pointer;
    background: var(--accent);
    color: var(--accent-text);
    min-height: 44px;
    white-space: nowrap;
  }

  button.ghost {
    background: transparent;
    color: var(--muted);
    border: 1px solid var(--border);
  }

  button.soft {
    background: var(--accent-soft);
    color: var(--accent);
  }

  button.danger { background: var(--danger); color: #fff; }
  button.tab-active { background: var(--accent-soft); color: var(--accent); }
  button.tab-idle { background: transparent; color: var(--muted); }

  button.small { padding: 7px 12px; min-height: 34px; font-size: 13px; border-radius: 9px; }

  /* ---------- Раскладка ---------- */
  main {
    max-width: 760px;
    margin: 0 auto;
    padding: 16px 16px 112px; /* место под нижнюю панель на телефоне */
    display: grid;
    gap: 14px;
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 18px;
    box-shadow: var(--shadow);
  }

  .card-title {
    font-size: 13px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--muted);
    margin: 0 0 12px;
  }

  /* ---------- Итоги ---------- */
  .hero {
    background: linear-gradient(135deg, var(--hero-from), var(--hero-to));
    color: #fff;
    border: none;
    padding: 20px;
  }

  .hero .card-title { color: rgba(255, 255, 255, 0.75); margin-bottom: 4px; }

  .hero-totals {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
  }

  .hero-value { font-size: 28px; font-weight: 700; letter-spacing: -0.01em; }
  .hero-label { font-size: 13px; color: rgba(255, 255, 255, 0.75); }
  .hero-note { font-size: 12px; color: rgba(255, 255, 255, 0.7); margin-top: 12px; }

  /* ---------- Скоро списания ---------- */
  .upcoming {
    background: var(--warn-soft);
    border-color: transparent;
  }

  .upcoming .card-title { color: var(--warn); }

  .upcoming-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    padding: 8px 0;
  }

  .upcoming-item + .upcoming-item { border-top: 1px solid color-mix(in srgb, var(--warn) 25%, transparent); }
  .upcoming-name { font-weight: 600; }
  .upcoming-when { font-size: 13px; color: var(--warn); font-weight: 600; white-space: nowrap; }

  /* ---------- Список подписок ---------- */
  #subs-list { display: grid; gap: 10px; }

  .sub-item {
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 12px;
    padding: 14px 16px;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 14px;
  }
  .sub-name { font-weight: 600; font-size: 16px; }
  .sub-meta { color: var(--muted); font-size: 13px; margin-top: 3px; }

  .sub-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }

  .chip {
    font-size: 12px;
    padding: 3px 9px;
    border-radius: 999px;
    background: var(--surface-2);
    color: var(--muted);
    border: 1px solid var(--border);
  }

  .chip.soon { background: var(--warn-soft); color: var(--warn); border-color: transparent; }

  .sub-amount { font-weight: 700; font-size: 16px; text-align: right; white-space: nowrap; }
  .sub-amount small { display: block; font-weight: 500; font-size: 12px; color: var(--muted); margin-top: 2px; }

  .sub-actions { display: flex; gap: 8px; margin-top: 10px; }

  .empty {
    text-align: center;
    color: var(--muted);
    padding: 28px 8px;
  }

  .empty strong { display: block; color: var(--text); font-size: 16px; margin-bottom: 6px; }

  /* ---------- Нижняя панель (только телефон) ---------- */
  .bottom-nav {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 6;
    display: flex;
    gap: 8px;
    background: var(--surface);
    border-top: 1px solid var(--border);
    padding: 8px 12px calc(8px + env(safe-area-inset-bottom));
  }

  .bottom-nav button { flex: 1; }

  /* ---------- Настройки ---------- */
  .settings-grid { display: grid; gap: 14px; }

  .field-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }

  .segmented { display: flex; gap: 6px; background: var(--surface-2); padding: 4px; border-radius: 12px; }
  .segmented button { flex: 1; background: transparent; color: var(--muted); }
  .segmented button.on { background: var(--surface); color: var(--text); box-shadow: var(--shadow); }

  .action-row { display: flex; gap: 8px; flex-wrap: wrap; }
  .action-row button { flex: 1; min-width: 140px; }

  .notice {
    background: var(--warn-soft);
    color: var(--warn);
    border-radius: 12px;
    padding: 12px;
    font-size: 14px;
  }

  .muted { color: var(--muted); font-size: 14px; }

  /* ---------- Формы и модальные окна ---------- */
  form { display: grid; gap: 14px; }
  label { display: grid; gap: 6px; font-size: 13px; font-weight: 500; color: var(--muted); }

  input, select, textarea {
    font: inherit;
    font-size: 16px;
    padding: 12px 14px;
    border: 1px solid var(--border);
    border-radius: 12px;
    background: var(--surface-2);
    color: var(--text);
    width: 100%;
    min-height: 46px;
    color-scheme: inherit;
  }

  input:focus, select:focus, textarea:focus {
    outline: 2px solid var(--accent);
    outline-offset: -1px;
  }

  textarea { min-height: 80px; resize: vertical; }

  .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .form-actions { display: flex; gap: 8px; }
  .form-actions button { flex: 1; }

  .error { color: var(--danger); font-size: 14px; margin: 0; }

  .hidden { display: none !important; }

  .modal-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(5, 8, 16, 0.55);
    display: flex;
    align-items: flex-end;
    justify-content: center;
    z-index: 10;
  }

  .modal {
    background: var(--surface);
    width: 100%;
    max-width: 560px;
    max-height: 92vh;
    overflow: auto;
    border-radius: 20px 20px 0 0;
    padding: 20px 18px;
    padding-bottom: calc(18px + env(safe-area-inset-bottom));
  }

  .modal h2 { font-size: 18px; margin: 0 0 14px; }
  .modal p { margin: 0 0 14px; color: var(--muted); }

  /* ---------- Адаптивность ---------- */
  @media (min-width: 720px) {
    .header-tabs { display: flex; }
    .bottom-nav { display: none; }
    main { padding-bottom: 32px; }
    .modal-backdrop { align-items: center; }
    .modal { border-radius: 20px; }
    .card { padding: 22px; }
  }

  @media (max-width: 480px) {
    .form-row, .field-grid { grid-template-columns: 1fr; }
    .hero-value { font-size: 24px; }
  }
</style>
</head>
<body>

<header>
  <div class="brand">Подписки</div>
  <nav class="header-tabs" aria-label="Разделы">
    <button class="tab-active" data-tab="list">Подписки</button>
    <button class="tab-idle" data-tab="settings">Настройки</button>
  </nav>
  <button id="btn-add">+ Добавить</button>
</header>

<main>
  <section id="view-list">
    <div id="upcoming-box" class="card upcoming hidden">
      <h2 class="card-title">Скоро списания · 7 дней</h2>
      <div id="upcoming-list"></div>
    </div>

    <div class="card hero">
      <div class="card-title">Расходы</div>
      <div class="hero-totals">
        <div>
          <div class="hero-value" id="total-month">0 ₽</div>
          <div class="hero-label">в месяц</div>
        </div>
        <div>
          <div class="hero-value" id="total-year">0 ₽</div>
          <div class="hero-label">в год</div>
        </div>
      </div>
      <div class="hero-note" id="total-note"></div>
    </div>

    <div class="card">
      <h2 class="card-title">Все подписки</h2>
      <div id="subs-list"></div>
    </div>
  </section>

  <section id="view-settings" class="hidden settings-grid">
    <div class="card">
      <h2 class="card-title">Тема</h2>
      <div class="segmented" id="theme-switch">
        <button data-theme-value="system">Системная</button>
        <button data-theme-value="light">Светлая</button>
        <button data-theme-value="dark">Тёмная</button>
      </div>
    </div>

    <div class="card">
      <h2 class="card-title">Курсы валют к рублю</h2>
      <form id="rates-form">
        <div class="field-grid">
          <label>USD
            <input id="rate-usd" type="number" min="0" step="0.01" inputmode="decimal" placeholder="например 92.5">
          </label>
          <label>EUR
            <input id="rate-eur" type="number" min="0" step="0.01" inputmode="decimal" placeholder="например 100">
          </label>
        </div>
        <p class="muted">Без курса подписки в этой валюте не попадают в итоги.</p>
        <button type="submit">Сохранить курсы</button>
      </form>
    </div>

    <div class="card">
      <h2 class="card-title">Данные</h2>
      <div class="action-row">
        <button id="btn-export" class="soft">Экспорт в файл</button>
        <button id="btn-import" class="soft">Импорт из файла</button>
        <input id="import-file" type="file" accept="application/json,.json" class="hidden">
      </div>
      <p id="import-error" class="error hidden" style="margin-top:12px"></p>
    </div>

    <div class="card">
      <h2 class="card-title">Уведомления</h2>
      <div id="notif-status"></div>
    </div>
  </section>
</main>

<nav class="bottom-nav" aria-label="Разделы">
  <button class="tab-active" data-tab="list">Подписки</button>
  <button class="tab-idle" data-tab="settings">Настройки</button>
</nav>

<div id="modal-root"></div>

<script>
/* ==========================================================
   Слой данных. Интерфейс работает только через эти функции,
   поэтому синхронизацию (Supabase/Firebase) можно подключить
   заменой storage-функций, не трогая UI.
   ========================================================== */

const SCHEMA_VERSION = 1;
const STORAGE_KEY = "subscriptions-tracker:data";
const RATES_KEY = "subscriptions-tracker:rates";
const THEME_KEY = "subscriptions-tracker:theme";
const CURRENCIES = ["RUB", "USD", "EUR"];
const PERIODS = { monthly: "Раз в месяц", yearly: "Раз в год" };
const CARD_PATTERN = /\b(?:\d[ -]?){13,19}\b/;

const DataStore = {
  load() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return { version: SCHEMA_VERSION, subscriptions: [] };
      return migrate(JSON.parse(raw));
    } catch {
      return { version: SCHEMA_VERSION, subscriptions: [] };
    }
  },

  save(data) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
  },

  loadRates() {
    try {
      const raw = JSON.parse(localStorage.getItem(RATES_KEY) || "null");
      return raw && typeof raw === "object" ? raw : { USD: null, EUR: null };
    } catch {
      return { USD: null, EUR: null };
    }
  },

  saveRates(rates) {
    localStorage.setItem(RATES_KEY, JSON.stringify(rates));
  },

  loadTheme() {
    try {
      return localStorage.getItem(THEME_KEY) || "system";
    } catch {
      return "system";
    }
  },

  saveTheme(theme) {
    try {
      localStorage.setItem(THEME_KEY, theme);
    } catch {
      /* Тема просто не запомнится — интерфейс работает и так */
    }
  },
};

/* Приводит данные любой поддерживаемой версии к текущей схеме. */
function migrate(data) {
  if (!data || typeof data !== "object" || !Array.isArray(data.subscriptions)) {
    throw new Error("Нет списка подписок");
  }
  const version = Number(data.version) || 1;
  if (version > SCHEMA_VERSION) {
    throw new Error("Файл создан более новой версией приложения");
  }
  // Здесь добавляются преобразования при появлении версии 2 и выше.
  return { version: SCHEMA_VERSION, subscriptions: data.subscriptions.map(normalizeSubscription) };
}

/* Проверяет и нормализует одну подписку. Бросает ошибку с понятным текстом. */
function normalizeSubscription(raw) {
  if (!raw || typeof raw !== "object") throw new Error("Некорректная запись подписки");
  const name = String(raw.name || "").trim();
  const amount = Number(raw.amount);
  const currency = String(raw.currency || "");
  const period = String(raw.period || "");
  const nextDate = String(raw.nextDate || "");
  if (!name) throw new Error("У подписки не указано название");
  if (!Number.isFinite(amount) || amount < 0) throw new Error(`Некорректная сумма у «${name}»`);
  if (!CURRENCIES.includes(currency)) throw new Error(`Неизвестная валюта у «${name}»`);
  if (!PERIODS[period]) throw new Error(`Неизвестная периодичность у «${name}»`);
  if (!isIsoDate(nextDate)) throw new Error(`Некорректная дата у «${name}»`);
  const source = String(raw.source || "").trim();
  if (CARD_PATTERN.test(source)) throw new Error(`В поле «Откуда списывается» похоже на номер карты у «${name}»`);

  return {
    id: String(raw.id || newId()),
    name,
    amount,
    currency,
    period,
    nextDate,
    category: String(raw.category || "").trim(),
    source,
    note: String(raw.note || "").trim(),
  };
}

function isIsoDate(value) {
  return /^\d{4}-\d{2}-\d{2}$/.test(value) && !Number.isNaN(parseDate(value).getTime());
}

/* ---------- Экспорт / импорт ---------- */

function exportPayload(data) {
  return JSON.stringify({ version: SCHEMA_VERSION, exportedAt: new Date().toISOString(), subscriptions: data.subscriptions }, null, 2);
}

function parseImport(text) {
  let parsed;
  try {
    parsed = JSON.parse(text);
  } catch {
    throw new Error("Файл не является корректным JSON");
  }
  return migrate(parsed);
}

/* ---------- Даты и расчёты ---------- */

function parseDate(iso) {
  const [y, m, d] = iso.split("-").map(Number);
  return new Date(y, m - 1, d);
}

function formatDate(iso) {
  return parseDate(iso).toLocaleDateString("ru-RU", { day: "numeric", month: "long", year: "numeric" });
}

function todayStart() {
  const now = new Date();
  return new Date(now.getFullYear(), now.getMonth(), now.getDate());
}

function toIsoDate(date) {
  const pad = (n) => String(n).padStart(2, "0");
  return `${date.getFullYear()}-${pad(date.getMonth() + 1)}-${pad(date.getDate())}`;
}

/* Прибавляет один период. Для месяца с меньшим числом дней берётся последний день месяца. */
function addPeriod(date, period) {
  const step = period === "yearly" ? 12 : 1;
  const day = date.getDate();
  const result = new Date(date.getFullYear(), date.getMonth() + step, 1);
  const lastDay = new Date(result.getFullYear(), result.getMonth() + 1, 0).getDate();
  result.setDate(Math.min(day, lastDay));
  return result;
}

/* Если дата уже прошла, сдвигает её вперёд на периоды до ближайшей будущей (или сегодня). */
function rollForwardDate(iso, period) {
  let date = parseDate(iso);
  const today = todayStart();
  while (date < today) {
    date = addPeriod(date, period);
  }
  return toIsoDate(date);
}

function refreshDates(subscriptions) {
  let changed = false;
  const updated = subscriptions.map((sub) => {
    const next = rollForwardDate(sub.nextDate, sub.period);
    if (next !== sub.nextDate) {
      changed = true;
      return { ...sub, nextDate: next };
    }
    return sub;
  });
  return { subscriptions: updated, changed };
}

/* Сумма в рублях в месяц. Возвращает null, если курс валюты не задан. */
function monthlyInRub(sub, rates) {
  const rate = sub.currency === "RUB" ? 1 : Number(rates[sub.currency]);
  if (!rate || rate <= 0) return null;
  const monthlyAmount = sub.period === "yearly" ? sub.amount / 12 : sub.amount;
  return monthlyAmount * rate;
}

function calculateTotals(subscriptions, rates) {
  let month = 0;
  let skipped = 0;
  for (const sub of subscriptions) {
    const value = monthlyInRub(sub, rates);
    if (value === null) skipped += 1;
    else month += value;
  }
  return { month, year: month * 12, skipped };
}

function daysUntil(iso) {
  return Math.round((parseDate(iso) - todayStart()) / 86400000);
}

function upcomingSubscriptions(subscriptions, days = 7) {
  return subscriptions
    .filter((sub) => {
      const left = daysUntil(sub.nextDate);
      return left >= 0 && left <= days;
    })
    .sort((a, b) => a.nextDate.localeCompare(b.nextDate));
}

function newId() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
}

/* ---------- Форматирование ---------- */

function formatMoney(value, currency) {
  return new Intl.NumberFormat("ru-RU", { style: "currency", currency, minimumFractionDigits: 0, maximumFractionDigits: 2 }).format(value);
}

function escapeHtml(value) {
  return String(value).replace(/[&<>"']/g, (ch) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[ch]);
}

/* ==========================================================
   Состояние и интерфейс
   ========================================================== */

const state = {
  data: DataStore.load(),
  rates: DataStore.loadRates(),
  theme: DataStore.loadTheme(),
  tab: "list",
};

const $ = (id) => document.getElementById(id);

function persist() {
  DataStore.save(state.data);
}

/* Пересчитывает просроченные даты при каждом открытии страницы. */
function applyDateRefresh() {
  const result = refreshDates(state.data.subscriptions);
  if (result.changed) {
    state.data.subscriptions = result.subscriptions;
    persist();
  }
}

function render() {
  renderUpcoming();
  renderTotals();
  renderList();
}

function renderUpcoming() {
  const items = upcomingSubscriptions(state.data.subscriptions);
  $("upcoming-box").classList.toggle("hidden", items.length === 0);
  $("upcoming-list").innerHTML = items
    .map((sub) => {
      const left = daysUntil(sub.nextDate);
      const when = left === 0 ? "сегодня" : left === 1 ? "завтра" : `через ${left} дн.`;
      return `<div class="upcoming-item">
        <div><div class="upcoming-name">${escapeHtml(sub.name)}</div>
        <div class="muted">${formatMoney(sub.amount, sub.currency)} · ${formatDate(sub.nextDate)}</div></div>
        <div class="upcoming-when">${when}</div>
      </div>`;
    })
    .join("");
}

function renderTotals() {
  const totals = calculateTotals(state.data.subscriptions, state.rates);
  $("total-month").textContent = formatMoney(totals.month, "RUB");
  $("total-year").textContent = formatMoney(totals.year, "RUB");
  const count = state.data.subscriptions.length;
  const note = [`Подписок: ${count}`];
  if (totals.skipped > 0) note.push(`без курса не учтено: ${totals.skipped}`);
  $("total-note").textContent = note.join(" · ");
}

function renderList() {
  const list = $("subs-list");
  if (state.data.subscriptions.length === 0) {
    list.innerHTML = `<div class="empty"><strong>Подписок пока нет</strong>Нажмите «+ Добавить», чтобы внести первую.</div>`;
    return;
  }
  const sorted = [...state.data.subscriptions].sort((a, b) => a.nextDate.localeCompare(b.nextDate));
  list.innerHTML = sorted
    .map((sub) => {
      const left = daysUntil(sub.nextDate);
      const soon = left >= 0 && left <= 7;
      const chips = [
        sub.category && `<span class="chip">${escapeHtml(sub.category)}</span>`,
        `<span class="chip">${PERIODS[sub.period]}</span>`,
        `<span class="chip ${soon ? "soon" : ""}">${formatDate(sub.nextDate)}</span>`,
        sub.source && `<span class="chip">${escapeHtml(sub.source)}</span>`,
      ]
        .filter(Boolean)
        .join("");
      return `
        <div class="sub-item">
          <div>
            <div class="sub-name">${escapeHtml(sub.name)}</div>
            ${sub.note ? `<div class="sub-meta">${escapeHtml(sub.note)}</div>` : ""}
            <div class="sub-chips">${chips}</div>
            <div class="sub-actions">
              <button class="ghost small" data-action="edit" data-id="${sub.id}">Изменить</button>
              <button class="ghost small" data-action="delete" data-id="${sub.id}">Удалить</button>
            </div>
          </div>
          <div class="sub-amount">${formatMoney(sub.amount, sub.currency)}<small>${sub.period === "yearly" ? "в год" : "в месяц"}</small></div>
        </div>`;
    })
    .join("");
}

/* ---------- Модальное окно ---------- */

function openModal(html) {
  $("modal-root").innerHTML = `<div class="modal-backdrop"><div class="modal" role="dialog" aria-modal="true">${html}</div></div>`;
  return $("modal-root").querySelector(".modal");
}

function closeModal() {
  $("modal-root").innerHTML = "";
}

function openSubscriptionForm(existing) {
  const sub = existing || { name: "", amount: "", currency: "RUB", period: "monthly", nextDate: toIsoDate(todayStart()), category: "", source: "", note: "" };
  const title = existing ? "Изменить подписку" : "Новая подписка";
  const modal = openModal(`
    <h2>${title}</h2>
    <form id="sub-form">
      <label>Название
        <input name="name" required maxlength="100" value="${escapeHtml(sub.name)}">
      </label>
      <div class="form-row">
        <label>Сумма
          <input name="amount" type="number" min="0" step="0.01" required inputmode="decimal" value="${sub.amount}">
        </label>
        <label>Валюта
          <select name="currency">
            ${CURRENCIES.map((c) => `<option value="${c}" ${c === sub.currency ? "selected" : ""}>${c}</option>`).join("")}
          </select>
        </label>
      </div>
      <div class="form-row">
        <label>Периодичность
          <select name="period">
            ${Object.entries(PERIODS).map(([k, v]) => `<option value="${k}" ${k === sub.period ? "selected" : ""}>${v}</option>`).join("")}
          </select>
        </label>
        <label>Дата следующего списания
          <input name="nextDate" type="date" required value="${sub.nextDate}">
        </label>
      </div>
      <label>Категория
        <input name="category" maxlength="60" value="${escapeHtml(sub.category)}">
      </label>
      <label>Откуда списывается
        <input name="source" maxlength="100" placeholder="Например: карта Сбера или кошелёк Apple ID" value="${escapeHtml(sub.source)}">
      </label>
      <label>Примечание
        <textarea name="note" maxlength="500">${escapeHtml(sub.note)}</textarea>
      </label>
      <p id="form-error" class="error hidden"></p>
      <div class="form-actions">
        <button type="button" class="ghost" data-action="cancel">Отмена</button>
        <button type="submit">Сохранить</button>
      </div>
    </form>`);

  modal.querySelector("[data-action=cancel]").addEventListener("click", closeModal);
  modal.querySelector("#sub-form").addEventListener("submit", (event) => {
    event.preventDefault();
    const form = event.target;
    const errorBox = $("form-error");
    const draft = {
      id: existing ? existing.id : newId(),
      name: form.name.value,
      amount: form.amount.value,
      currency: form.currency.value,
      period: form.period.value,
      nextDate: form.nextDate.value,
      category: form.category.value,
      source: form.source.value,
      note: form.note.value,
    };
    try {
      const saved = normalizeSubscription(draft);
      const others = state.data.subscriptions.filter((s) => s.id !== saved.id);
      state.data.subscriptions = refreshDates([...others, saved]).subscriptions;
      persist();
      closeModal();
      render();
    } catch (error) {
      errorBox.textContent = error.message;
      errorBox.classList.remove("hidden");
    }
  });
}

function confirmDelete(id) {
  const sub = state.data.subscriptions.find((s) => s.id === id);
  if (!sub) return;
  const modal = openModal(`
    <h2>Удалить подписку?</h2>
    <p>«${escapeHtml(sub.name)}» будет удалена без возможности восстановления.</p>
    <div class="form-actions">
      <button class="ghost" data-action="cancel">Отмена</button>
      <button class="danger" data-action="confirm">Удалить</button>
    </div>`);
  modal.querySelector("[data-action=cancel]").addEventListener("click", closeModal);
  modal.querySelector("[data-action=confirm]").addEventListener("click", () => {
    state.data.subscriptions = state.data.subscriptions.filter((s) => s.id !== id);
    persist();
    closeModal();
    render();
  });
}

/* ---------- Вкладки и тема ---------- */

function showTab(name) {
  state.tab = name;
  $("view-list").classList.toggle("hidden", name !== "list");
  $("view-settings").classList.toggle("hidden", name !== "settings");
  document.querySelectorAll("[data-tab]").forEach((button) => {
    const active = button.dataset.tab === name;
    button.className = active ? "tab-active" : "tab-idle";
  });
  $("btn-add").classList.toggle("hidden", name !== "list");
}

function applyTheme(theme) {
  state.theme = theme;
  DataStore.saveTheme(theme);
  // Для системной темы атрибут не ставим: работает медиазапрос.
  if (theme === "system") document.documentElement.removeAttribute("data-theme");
  else document.documentElement.setAttribute("data-theme", theme);
  document.querySelectorAll("[data-theme-value]").forEach((button) => {
    button.classList.toggle("on", button.dataset.themeValue === theme);
  });
}

/* ---------- Настройки: курсы, экспорт, импорт, уведомления ---------- */

function renderRatesForm() {
  $("rate-usd").value = state.rates.USD ?? "";
  $("rate-eur").value = state.rates.EUR ?? "";
}

function exportData() {
  const blob = new Blob([exportPayload(state.data)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const link = document.createElement("a");
  link.href = url;
  link.download = "subscriptions.json";
  document.body.appendChild(link);
  link.click();
  link.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

async function handleImportFile(file) {
  const errorBox = $("import-error");
  errorBox.classList.add("hidden");
  try {
    const imported = parseImport(await file.text());
    const ok = confirm(`Заменить текущие данные (${state.data.subscriptions.length} шт.) на данные из файла (${imported.subscriptions.length} шт.)?`);
    if (!ok) return;
    state.data = { version: SCHEMA_VERSION, subscriptions: refreshDates(imported.subscriptions).subscriptions };
    persist();
    render();
    alert("Данные импортированы.");
  } catch (error) {
    errorBox.textContent = `Не удалось импортировать: ${error.message}`;
    errorBox.classList.remove("hidden");
  }
}

function renderNotificationStatus() {
  const box = $("notif-status");
  if (!("Notification" in window)) {
    box.innerHTML = `<div class="notice">Этот браузер не поддерживает уведомления. Блок «Скоро списания» виден на главном экране.</div>`;
    return;
  }
  if (Notification.permission === "granted") {
    box.innerHTML = `<p class="muted" style="margin:0">Уведомления разрешены.</p>`;
  } else if (Notification.permission === "denied") {
    box.innerHTML = `<div class="notice">Уведомления запрещены в настройках браузера.</div>`;
  } else {
    box.innerHTML = `<button id="btn-notif">Разрешить уведомления</button>`;
    $("btn-notif").addEventListener("click", async () => {
      await Notification.requestPermission();
      renderNotificationStatus();
    });
  }
}

/* ---------- Запуск ---------- */

function bindEvents() {
  $("btn-add").addEventListener("click", () => openSubscriptionForm(null));

  document.querySelectorAll("[data-tab]").forEach((button) => {
    button.addEventListener("click", () => showTab(button.dataset.tab));
  });

  document.querySelectorAll("[data-theme-value]").forEach((button) => {
    button.addEventListener("click", () => applyTheme(button.dataset.themeValue));
  });

  $("subs-list").addEventListener("click", (event) => {
    const button = event.target.closest("button[data-action]");
    if (!button) return;
    const sub = state.data.subscriptions.find((s) => s.id === button.dataset.id);
    if (button.dataset.action === "edit" && sub) openSubscriptionForm(sub);
    if (button.dataset.action === "delete") confirmDelete(button.dataset.id);
  });

  $("rates-form").addEventListener("submit", (event) => {
    event.preventDefault();
    state.rates = {
      USD: Number($("rate-usd").value) || null,
      EUR: Number($("rate-eur").value) || null,
    };
    DataStore.saveRates(state.rates);
    render();
    alert("Курсы сохранены.");
  });

  $("btn-export").addEventListener("click", exportData);
  $("btn-import").addEventListener("click", () => $("import-file").click());
  $("import-file").addEventListener("change", (event) => {
    const file = event.target.files[0];
    event.target.value = "";
    if (file) handleImportFile(file);
  });
}

function start() {
  applyTheme(state.theme);
  applyDateRefresh();
  bindEvents();
  renderRatesForm();
  renderNotificationStatus();
  render();
  showTab("list");

  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  }
}

start();
</script>
</body>
</html>
